<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>entwine</title>
    <meta name="description" content="A local-first issue tracker." />
    <script>
      // The stored theme (src/preferences/theme.ts), applied before the first paint so a light page never flashes dark.
      try {
        var t = localStorage.getItem("entwine:theme");
        var d = t === "light" ? false : t === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : true;
      } catch (e) {
        d = true;
      }
      document.documentElement.classList.toggle("dark", d);
      document.documentElement.style.colorScheme = d ? "dark" : "light";
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
